# Runs on every push to main + manual dispatch. CI always runs; deploy runs on main after CI.
name: Backend CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: interviewveil
          POSTGRES_PASSWORD: test
          POSTGRES_DB: interviewveil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interviewveil -d interviewveil_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install, typecheck, test, build
        env:
          DATABASE_URL: postgres://interviewveil:test@localhost:5432/interviewveil_test
          STT_API_KEY: test-stt-key
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  deploy:
    name: Deploy to AWS (SSH)
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Verify deploy secrets
        run: |
          test -n "${{ secrets.SSH_HOST }}" || { echo "::error::Missing repository secret SSH_HOST"; exit 1; }
          test -n "${{ secrets.SSH_USER }}" || { echo "::error::Missing repository secret SSH_USER"; exit 1; }
          test -n "${{ secrets.SSH_PRIVATE_KEY }}" || { echo "::error::Missing repository secret SSH_PRIVATE_KEY"; exit 1; }

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            APP="/var/www/interviewveil"
            DEPLOY_USER="deploy"
            export DEPLOY_PATH="$APP"
            if [ "$(whoami)" = "$DEPLOY_USER" ]; then
              bash "$APP/deploy/native/pull-and-deploy.sh"
            elif sudo -n -u "$DEPLOY_USER" -H bash "$APP/deploy/native/pull-and-deploy.sh"; then
              true
            else
              echo "Git/npm/pm2 must run as ${DEPLOY_USER} (repo owner). Either:"
              echo "  1) Set GitHub secret SSH_USER=${DEPLOY_USER} and SSH with deploy's key, or"
              echo "  2) On EC2: echo 'ubuntu ALL=(${DEPLOY_USER}) NOPASSWD: ALL' | sudo tee /etc/sudoers.d/github-deploy && sudo chmod 440 /etc/sudoers.d/github-deploy"
              exit 1
            fi
