# Production stack for a single EC2 instance:
#   Caddy (HTTPS, automatic Let's Encrypt) → InterviewVeil API → Postgres (RDS)
# Usage (on the server, from backend/):
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  api:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      PORT: "8787"
    expose:
      - "8787"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN, e.g. api.interviewveil.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
