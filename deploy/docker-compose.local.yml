services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: interviewveil
      POSTGRES_USER: interviewveil
      POSTGRES_PASSWORD: localdev
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewveil -d interviewveil"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  local_postgres_data:
